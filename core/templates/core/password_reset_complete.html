{% extends 'base.html' %}
{% block title %}Contraseña actualizada{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-11 col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body text-center p-5">
                <div class="display-4 text-success"><i class="bi bi-check-circle"></i></div>
                <h4 class="mt-3">Contraseña actualizada</h4>
                <p class="text-muted">Ya puedes entrar con tu nueva contraseña.</p>
                <a href="{% url 'core:login' %}" class="btn btn-primary">Ir al login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
